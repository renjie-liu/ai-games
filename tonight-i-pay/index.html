<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今晚，我买单</title>
<meta name="description" content="互动短剧试玩版：竖屏、第一人称，镜头就是你。三年前周家把你扫地出门，今晚他们还不知道站在门口的人是谁。">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
:root {
  --velvet: #3a0b15;
  --velvet-deep: #22060c;
  --gold: #e6c27a;
  --gold-hot: #ffdf9a;
  --pearl: #f7f0e6;
  --ink: #1a0508;
  --display: "ZCOOL QingKe HuangYou", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --text: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--velvet-deep);
  color: var(--pearl);
  font-family: var(--text);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* ---------- the room around the screen ---------- */
.hall {
  height: 100dvh;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: clamp(24px, 5vw, 72px);
  padding: 24px;
  background: radial-gradient(120% 70% at 50% -10%, #6b1a2a 0%, var(--velvet) 38%, var(--velvet-deep) 100%);
}
.poster {
  justify-self: end;
  display: flex;
  flex-direction: row-reverse;
  gap: 18px;
  height: min(78vh, 720px);
}
.poster h1 {
  writing-mode: vertical-rl;
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(56px, 7.2vw, 104px);
  line-height: 1.05;
  letter-spacing: 0.06em;
  color: var(--gold);
}
.poster p {
  writing-mode: vertical-rl;
  margin: 8px 0 0;
  font-size: 14px;
  letter-spacing: 0.28em;
  color: rgba(247, 240, 230, 0.62);
}
.notes {
  justify-self: start;
  max-width: 250px;
  font-size: 14px;
  line-height: 1.8;
  color: rgba(247, 240, 230, 0.78);
}
.notes p { margin: 0 0 14px; }
.notes .fine { font-size: 12.5px; color: rgba(247, 240, 230, 0.5); }

/* ---------- the screen ---------- */
.stage {
  --stage-w: calc(min(100dvh - 48px, 860px) * 0.5625);   /* its own width, for type that must fit on one line */
  position: relative;
  height: min(calc(100dvh - 48px), 860px);
  aspect-ratio: 9 / 16;
  border-radius: 28px;
  overflow: hidden;
  overflow: clip; /* hidden still scrolls when something off-screen takes focus; clip never does */
  background: #000;
  box-shadow: 0 0 0 1px rgba(230, 194, 122, 0.35), 0 30px 80px rgba(0, 0, 0, 0.55);
}
.stage video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
}
.stage video.on { opacity: 1; }

.bars {
  position: absolute;
  top: 14px; left: 14px; right: 14px;
  display: flex;
  gap: 4px;
  z-index: 5;
}
.bars i { flex: 1; height: 3px; border-radius: 2px; background: rgba(247, 240, 230, 0.28); overflow: hidden; }
.bars b { display: block; height: 100%; width: 0; background: var(--pearl); }

.topline {
  position: absolute;
  top: 24px; left: 16px; right: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 5;
  font-size: 13px;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75);
}
.topline strong { font-weight: 600; margin-right: 8px; }
.mute {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border: 0; border-radius: 50%;
  background: none;
  cursor: pointer;
}
.mute svg { width: 20px; height: 20px; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.7)); }
.mute .off { display: none; }
.mute[aria-pressed="true"] .off { display: block; }
.mute[aria-pressed="true"] .wave { display: none; }

.sub {
  position: absolute;
  left: 20px; right: 20px; bottom: 16%;
  margin: 0;
  z-index: 4;
  text-align: center;
  text-wrap: balance;
  font-size: clamp(17px, 2.4vh, 21px);
  font-weight: 700;
  line-height: 1.45;
  color: #fff;
  text-shadow: 0 0 3px #000, 0 2px 8px rgba(0, 0, 0, 0.9);
  opacity: 0;
  transition: bottom 0.28s ease;
}
.sub.show { opacity: 1; }
.sub small { display: block; font-size: 0.72em; font-weight: 600; color: var(--gold-hot); }
.stage.choosing .sub { bottom: 47%; }

/* story clock: the time inside the story, and how long until the hotel changes hands */
.clock {
  position: absolute;
  top: 62px; left: 14px;
  z-index: 5;
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 5px 11px 5px 10px;
  border-radius: 14px;
  background: rgba(22, 4, 8, 0.62);
  border: 1px solid rgba(230, 194, 122, 0.4);
  font-size: 12.5px;
  color: rgba(247, 240, 230, 0.82);
  transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
}
.clock b { font-family: var(--display); font-weight: 400; font-size: 19px; letter-spacing: 0.06em; color: var(--gold-hot); font-variant-numeric: tabular-nums; }
.clock.struck { background: var(--gold-hot); border-color: var(--gold-hot); color: var(--ink); }
.clock.struck b { color: var(--ink); }
.clock.memo { border-style: dashed; }

/* a message from your assistant, the way a phone shows one */
.note {
  position: absolute;
  top: 100px; left: 12px; right: 12px;
  z-index: 5;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 10px 14px 11px 10px;
  border-radius: 18px;
  background: rgba(247, 240, 230, 0.95);
  color: var(--ink);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
  transform: translateY(-16px);
  opacity: 0;
  visibility: hidden;
  transition: transform 0.26s cubic-bezier(0.2, 0.9, 0.2, 1), opacity 0.2s ease, visibility 0s 0.26s;
}
.note.show { transform: none; opacity: 1; visibility: visible; transition-delay: 0s; }
.note .face {
  flex: none;
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--velvet);
  color: var(--gold-hot);
  font-family: var(--display);
  font-size: 18px;
}
.note .who { margin: 0 0 1px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: rgba(26, 5, 8, 0.62); }
.note .text { margin: 0; font-size: 14.5px; line-height: 1.5; font-weight: 600; }

.loading {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  z-index: 6;
  margin: 0;
  padding: 9px 18px;
  border-radius: 20px;
  background: rgba(22, 4, 8, 0.78);
  border: 1px solid rgba(230, 194, 122, 0.4);
  font-size: 14px;
  color: var(--pearl);
}

/* shown only when something outside the page paused the clip (a call, a hidden tab) */
.resume {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  z-index: 8;
  display: flex;
  align-items: center;
  gap: 8px;
  height: 52px;
  padding: 0 22px 0 16px;
  border: 1px solid rgba(230, 194, 122, 0.7);
  border-radius: 26px;
  background: rgba(34, 6, 12, 0.82);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.resume svg { width: 22px; height: 22px; color: var(--gold-hot); }
.resume:focus-visible { outline: 2px solid var(--gold-hot); outline-offset: 2px; }

/* ---------- the choice ---------- */
.choice {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: 6;
  padding: 44px 18px calc(20px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, rgba(34, 6, 12, 0.97) 0%, rgba(34, 6, 12, 0.88) 66%, rgba(34, 6, 12, 0) 100%);
  transform: translateY(102%);
  visibility: hidden;
  transition: transform 0.28s cubic-bezier(0.2, 0.9, 0.2, 1), visibility 0s 0.28s;
}
.choice.open { transform: none; visibility: visible; transition-delay: 0s; }
.choice h2 {
  margin: 0 0 4px;
  font-family: var(--display);
  font-weight: 400;
  font-size: 28px;
  letter-spacing: 0.08em;
  color: var(--gold-hot);
}
.opt {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  height: 56px;
  margin-top: 10px;
  padding: 0 18px;
  border: 1px solid rgba(230, 194, 122, 0.55);
  border-radius: 14px;
  background: rgba(58, 11, 21, 0.78);
  font-family: var(--display);
  font-size: 23px;
  letter-spacing: 0.06em;
  text-align: left;
  cursor: pointer;
  overflow: hidden;
  transition: transform 0.16s ease, opacity 0.2s ease, background 0.12s ease, color 0.12s ease;
}
.opt .fill {
  position: absolute; inset: 0;
  background: rgba(230, 194, 122, 0.3);
  transform-origin: left center;
  transform: scaleX(0);
}
.opt span, .opt kbd { position: relative; }
.opt kbd {
  display: none;
  min-width: 22px;
  padding: 2px 6px;
  border: 1px solid rgba(247, 240, 230, 0.4);
  border-radius: 6px;
  font-family: var(--text);
  font-size: 12px;
  text-align: center;
  color: rgba(247, 240, 230, 0.75);
}
@media (hover: hover) {
  .opt kbd { display: block; }
  .opt:hover { border-color: var(--gold-hot); }
}
.opt:focus-visible, .start:focus-visible, .again:focus-visible, .ghost:focus-visible, .mute:focus-visible, .name input:focus-visible {
  outline: 2px solid var(--gold-hot);
  outline-offset: 2px;
}
.opt.picked { background: var(--gold); color: var(--ink); border-color: var(--gold-hot); transform: scale(1.025); }
.opt.picked .fill { display: none; }
.opt.picked kbd { border-color: rgba(26, 5, 8, 0.4); color: var(--ink); }
.choice.done .opt:not(.picked) { opacity: 0.22; }
.hint { margin: 12px 2px 0; font-size: 12.5px; color: rgba(247, 240, 230, 0.62); }

/* ---------- the beat between your choice and its payoff ---------- */
.scene {
  position: absolute; inset: 0;
  z-index: 7;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 26px;
  padding: 28px;
  background: rgba(22, 4, 8, 0.82);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.16s ease;
}
.scene.on { opacity: 1; }
.you {
  margin: 0;
  max-width: 15em;
  text-align: center;
  font-family: var(--display);
  font-size: 30px;
  line-height: 1.35;
  letter-spacing: 0.05em;
  color: var(--pearl);
}
.you small {
  display: block;
  margin-bottom: 6px;
  font-family: var(--text);
  font-size: 13px;
  letter-spacing: 0.3em;
  color: var(--gold);
}
.you.aside { font-family: var(--text); font-size: 18px; font-weight: 600; letter-spacing: 0.04em; color: rgba(247, 240, 230, 0.86); }

.call { display: grid; justify-items: center; gap: 10px; }
.ring {
  position: relative;
  width: 84px; height: 84px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--gold);
  color: var(--ink);
}
.ring::before, .ring::after {
  content: "";
  position: absolute; inset: 0;
  border-radius: 50%;
  border: 2px solid var(--gold);
  animation: ripple 1.1s ease-out infinite;
}
.ring::after { animation-delay: 0.45s; }
.ring svg { width: 34px; height: 34px; }
@keyframes ripple { from { transform: scale(1); opacity: 0.8; } to { transform: scale(1.9); opacity: 0; } }
.call .who { margin: 14px 0 0; font-size: 19px; font-weight: 600; }
.call .state { margin: 0; font-size: 14px; color: rgba(247, 240, 230, 0.7); }

.card {
  position: relative;
  width: min(264px, 68vw);
  aspect-ratio: 1.586;
  padding: 18px 20px;
  border-radius: 14px;
  background: linear-gradient(135deg, #2b2b2e 0%, #0c0c0d 55%, #232326 100%);
  border: 1px solid rgba(230, 194, 122, 0.6);
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6);
  color: var(--gold);
  animation: slam 0.42s cubic-bezier(0.2, 1.4, 0.3, 1) both;
}
.card .brand { font-family: var(--display); font-size: 24px; letter-spacing: 0.14em; }
.card .chip { position: absolute; left: 20px; top: 40%; width: 38px; height: 28px; border-radius: 6px; background: linear-gradient(135deg, #f3dca6, #b8914a); }
.card .holder { position: absolute; left: 20px; bottom: 16px; font-size: 16px; letter-spacing: 0.18em; }
.card .tier { position: absolute; right: 20px; bottom: 16px; font-size: 12px; letter-spacing: 0.3em; color: rgba(230, 194, 122, 0.7); }
@keyframes slam { from { transform: translateY(60px) rotate(-9deg) scale(1.25); opacity: 0; } to { transform: rotate(-4deg); opacity: 1; } }

.dots { margin: 0; font-family: var(--display); font-size: 64px; letter-spacing: 0.3em; color: var(--gold); }
.dots i { font-style: normal; opacity: 0; animation: dot 0.3s ease forwards; }
.dots i:nth-child(2) { animation-delay: 0.35s; }
.dots i:nth-child(3) { animation-delay: 0.7s; }
@keyframes dot { to { opacity: 1; } }

/* narration between scenes */
.words { display: grid; gap: 14px; max-width: 16em; text-align: center; }
.words p { margin: 0; font-size: 20px; line-height: 1.6; font-weight: 600; letter-spacing: 0.04em; color: var(--pearl); animation: rise 0.5s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.big { margin: 0; text-align: center; white-space: nowrap; font-family: var(--display); font-size: min(calc(var(--stage-w) * 0.115), 58px); line-height: 1.1; letter-spacing: 0.05em; color: var(--gold-hot); animation: slam 0.42s cubic-bezier(0.2, 1.4, 0.3, 1) both; }

.tape { display: grid; justify-items: center; gap: 12px; }
.tape .wave { display: flex; align-items: center; gap: 4px; height: 54px; }
.tape .wave i { width: 5px; border-radius: 3px; background: var(--gold); animation: wave 0.7s ease-in-out infinite alternate; }
.tape .wave i:nth-child(odd) { animation-duration: 0.5s; }
.tape .wave i:nth-child(3n) { animation-duration: 0.9s; }
@keyframes wave { from { height: 10px; } to { height: 50px; } }
.tape .label { margin: 0; font-size: 13px; letter-spacing: 0.2em; color: var(--gold); }
.tape .quote { margin: 0; max-width: 15em; text-align: center; font-size: 19px; line-height: 1.6; font-weight: 600; }

.report { position: relative; width: min(290px, 76vw); padding: 20px 20px 26px; border-radius: 4px; background: var(--pearl); color: var(--ink); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6); animation: slam 0.42s cubic-bezier(0.2, 1.4, 0.3, 1) both; }
.report h3 { margin: 0 0 14px; padding-bottom: 10px; border-bottom: 1px solid rgba(26, 5, 8, 0.25); text-align: center; font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: 0.12em; }
.report p { margin: 10px 0 0; font-size: 17px; font-weight: 700; line-height: 1.4; }
.report small { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: rgba(26, 5, 8, 0.6); }
.report .stamp { position: absolute; right: 14px; bottom: 12px; padding: 6px 8px; border: 2px solid #b3261e; border-radius: 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.2em; color: #b3261e; transform: rotate(-12deg); opacity: 0.85; }

.msg { width: min(280px, 74vw); padding: 12px 14px 13px; border-radius: 18px; background: rgba(247, 240, 230, 0.96); color: var(--ink); animation: rise 0.35s ease both; }
.msg .who { margin: 0 0 3px; font-size: 12px; font-weight: 700; color: rgba(26, 5, 8, 0.6); }
.msg .text { margin: 0; font-size: 16px; line-height: 1.55; font-weight: 600; }

/* ---------- cover and ending ---------- */
.cover, .finale {
  position: absolute; inset: 0;
  z-index: 9;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 28px 22px calc(26px + env(safe-area-inset-bottom));
}
.cover {
  background:
    linear-gradient(to top, rgba(34, 6, 12, 0.98) 0%, rgba(34, 6, 12, 0.94) 44%, rgba(34, 6, 12, 0.6) 58%, rgba(34, 6, 12, 0) 76%),
    url("cover.jpg") center top / cover no-repeat, var(--velvet-deep);
}
.cover h2 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(50px, 8.6vh, 72px);
  line-height: 1.05;
  letter-spacing: 0.04em;
  color: var(--gold-hot);
}
.cover .ep { margin: 10px 0 0; font-size: 14px; letter-spacing: 0.14em; color: rgba(247, 240, 230, 0.75); }
.cover .logline { margin: 12px 0 0; font-size: 15.5px; line-height: 1.7; color: rgba(247, 240, 230, 0.9); }
.name { margin: 20px 0 0; display: flex; align-items: center; gap: 10px; font-size: 14.5px; }
.name input {
  width: 3.4em; height: 40px;
  padding: 0 8px;
  border: 1px solid rgba(230, 194, 122, 0.55);
  border-radius: 10px;
  background: rgba(58, 11, 21, 0.7);
  font-size: 18px;
  text-align: center;
}
.name input::placeholder { color: rgba(247, 240, 230, 0.45); }
.name b { font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--gold); letter-spacing: 0.08em; }
.start, .again {
  width: 100%; height: 56px;
  margin-top: 18px;
  border: 0; border-radius: 14px;
  background: var(--gold);
  color: var(--ink);
  font-family: var(--display);
  font-size: 24px;
  letter-spacing: 0.1em;
  cursor: pointer;
}
.start:disabled { background: rgba(230, 194, 122, 0.25); color: rgba(247, 240, 230, 0.7); font-family: var(--text); font-size: 15px; letter-spacing: 0.04em; cursor: default; }
.start:not(:disabled):hover, .again:hover { background: var(--gold-hot); }
.cover .problem { margin: 12px 0 0; font-size: 13.5px; line-height: 1.6; color: #ffb4a8; }

.finale { display: block; overflow-y: auto; background: rgba(34, 6, 12, 0.93); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.fin-in { min-height: 100%; display: flex; flex-direction: column; justify-content: center; }
.finale .to { margin: 0; font-size: 15px; color: rgba(247, 240, 230, 0.75); }
.finale h2 {
  margin: 10px 0 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(30px, 5vh, 44px);
  line-height: 1.18;
  letter-spacing: 0.04em;
  color: var(--gold-hot);
}
.finale h2 span { display: inline-block; white-space: nowrap; }
.finale .path { margin: 14px 0 0; font-size: 15px; color: rgba(247, 240, 230, 0.86); }
.seen { margin: 18px 0 0; }
.seen > p { margin: 0 0 2px; font-size: 14px; color: rgba(247, 240, 230, 0.75); }
.row { margin-top: 8px; font-size: 12.5px; color: rgba(247, 240, 230, 0.6); }
.pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 4px; }
.pill {
  display: grid; place-items: center;
  height: 32px;
  padding: 0 4px;
  border: 1px solid rgba(230, 194, 122, 0.3);
  border-radius: 8px;
  background: none;
  font-size: 12.5px;
  color: rgba(247, 240, 230, 0.6);
  white-space: nowrap;
  cursor: pointer;
}
.pill:hover { border-color: var(--gold-hot); color: var(--pearl); }
.pill:focus-visible { outline: 2px solid var(--gold-hot); outline-offset: 2px; }
.pill.tried { background: rgba(230, 194, 122, 0.32); border-color: transparent; color: var(--pearl); }
.pill.now { background: var(--gold-hot); border-color: transparent; color: var(--ink); font-weight: 600; }
.ghost {
  width: 100%; height: 46px;
  margin-top: 10px;
  border: 1px solid rgba(230, 194, 122, 0.55);
  border-radius: 14px;
  background: none;
  font-size: 15px;
  color: var(--pearl);
  cursor: pointer;
}
.ghost:hover { border-color: var(--gold-hot); }
.teaser { margin: 14px 0 0; font-size: 13px; color: rgba(247, 240, 230, 0.6); }
.teaser:empty { display: none; }

@media (max-width: 860px) {
  .hall { grid-template-columns: 1fr; padding: 0; }
  .poster, .notes { display: none; }
  .stage { --stage-w: 100vw; width: 100vw; height: 100dvh; aspect-ratio: auto; border-radius: 0; box-shadow: none; }
}
@media (prefers-reduced-motion: reduce) {
  .choice, .scene, .opt, .sub, .note, .clock { transition: none; }
  .ring::before, .ring::after, .card, .dots i, .words p, .big, .msg, .report, .tape .wave i { animation: none; opacity: 1; }
}
</style>
</head>
<body>
<main class="hall">
  <aside class="poster" aria-hidden="true">
    <h1>今晚，我买单</h1>
    <p>互动短剧 试玩版</p>
  </aside>

  <section class="stage" id="stage" aria-label="互动短剧播放器">
    <video id="va" playsinline preload="auto"></video>

const LINES = {}, NOTES = {};
EPISODES.forEach(ep => {
  Object.entries(ep.lines).forEach(([id, v]) => { LINES[id] = Array.isArray(v) ? v : [v]; });
  Object.assign(NOTES, ep.notes);
  ep.asked = [];   // every choice, in order, with the step it hangs on
  ep.acts = [];    // each act and how many clips it plays, for the progress strip
  ep.flow.forEach((step, at) => {
    if (step.act) { ep.acts.push({ name: step.act, units: 0 }); return; }
    if (!step.clip) return;
    const choice = step.choice && ep.choices[step.choice];
    if (choice) ep.asked.push({ id: step.choice, choice, at });
    step.branch = !!choice && choice.opts.some(o => o.clip);
    ep.acts[ep.acts.length - 1].units += step.branch ? 2 : 1;
  });
  ep.clipIds = [...new Set([...ep.flow.filter(s => s.clip).map(s => s.clip),
    ...ep.asked.flatMap(a => a.choice.opts.map(o => o.clip).filter(Boolean))])];
});

const CHOICE_MS = 6000;
const STORE_KEY = 'shuang-v3';
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
const src = id => 'clips/' + id + '.mp4';
const stage = $('stage'), videos = [$('va'), $('vb')];
let bars = [], current = -1, raf = 0;

const honorific = () => ($('surname').value.trim() || '陆') + '董';

function readStore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    return { tried: s.tried || {}, last: s.last || {} };
  } catch (e) { return { tried: {}, last: {} }; }
}
function writeStore(s) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) { /* private window: the tally just resets */ }
}

/* ----- clips are read straight from disk as they come up; only the next one is loaded ahead ----- */
async function findMissing(ep) {
  if (ep.ok || location.protocol === 'file:') return [];   // opened from disk, the <video> finds out by itself
  const missing = (await Promise.all(ep.clipIds.map(async id => {
    try { return (await fetch(src(id), { method: 'HEAD' })).ok ? null : id; } catch (e) { return id; }
  }))).filter(Boolean);
  ep.ok = !missing.length;
  return missing;
}
// Loads a clip into the hidden video ahead of time, so the cut to it has nothing left to decode.
function prime(id) {
  if (!id) return;
  const idle = videos[(current + 1) % 2];
  if (idle.dataset.clip === id) return;
  idle.dataset.clip = id;
  idle.src = src(id);
  idle.load();
}
const metadata = v => new Promise(r => {
  if (v.readyState >= 1) r(); else v.addEventListener('loadedmetadata', r, { once: true });
});
// The next clip on the spine after step `i`, looking past cards and beats.
function clipAfter(ep, i) {
  const step = ep.flow.slice(i + 1).find(s => s.clip);
  return step && step.clip;
}

/* ----- what sits on top of the picture ----- */
function buildBars(count) {
  const box = $('bars');
  box.innerHTML = '';
  bars = Array.from({ length: count }, () => {
    const track = document.createElement('i'), fill = document.createElement('b');
    track.append(fill);
    box.append(track);
    return fill;
  });
}
function setBar(slot, ratio) { if (bars[slot]) bars[slot].style.width = Math.min(100, ratio * 100) + '%'; }
function showSub(line) {
  const el = $('sub');
  if (!line) { el.classList.remove('show'); return; }
  if (el.dataset.text !== line.text) {
    el.dataset.text = line.text;
    el.innerHTML = '';
    const who = document.createElement('small'); who.textContent = line.who;
    el.append(who, line.text);
  }
  el.classList.add('show');
}
function showNote(text) {
  const el = $('note');
  if (!text) { el.classList.remove('show'); return; }
  if ($('note-text').textContent !== text) $('note-text').textContent = text;
  el.classList.add('show');
}
// `value` is a time inside the story ("19:43", counted down to `deal`), a label ("三年前"),
// or a [value, label] pair for a tracker that is not a time (episode 2's handwriting report).
function setClock(value, deal, struck) {
  const el = $('clock');
  if (!value) { el.hidden = true; return; }
  const [text, fixed] = Array.isArray(value) ? value : [value];
  const now = /^(\d\d):(\d\d)$/.exec(text), due = /^(\d\d):(\d\d)$/.exec(deal || '');
  let label = fixed || '回忆';
  if (!fixed && now && due) {
    const left = (due[1] * 60 + +due[2]) - (now[1] * 60 + +now[2]);
    label = left > 0 ? '距交割 ' + left + ' 分钟' : struck ? '交割完成' : '已交割';
  }
  $('clock-time').textContent = text;
  $('clock-label').textContent = label;
  el.classList.toggle('memo', label === '回忆');
  el.classList.toggle('struck', !!struck);
  el.hidden = false;
}

/* ----- playback -----
   Plays one clip and resolves when it ends. With `choice`, the sheet opens over the clip's last
   second and the promise resolves with the picked option; `preset` answers it without asking.
   `upNext` is the clip that follows for certain, primed as soon as this one is running. */
function playClip(id, o = {}) {
  return new Promise(async resolve => {
    prime(id);
    const next = videos[(current + 1) % 2], prev = videos[current];
    current = (current + 1) % 2;
    const busy = on => { $('loading').hidden = !on; };
    const slow = setTimeout(() => busy(true), 450);   // only a slow connection ever shows this
    if (o.tail) { await metadata(next); next.currentTime = Math.max(0, next.duration - o.tail); }
    else if (next.currentTime) next.currentTime = 0;
    try { await next.play(); } catch (e) { /* a blocked play() still shows the first frame */ }
    clearTimeout(slow);
    busy(false);
    next.classList.add('on');
    if (prev) { prev.classList.remove('on'); prev.pause(); }
    if (o.upNext) prime(o.upNext);
    if (o.clock) setClock(o.clock, o.deal);

    const lines = LINES[id] || [], notes = NOTES[id] || [];
    let asked = false, finished = false, flipped = false;
    const finish = value => {
      if (finished) return;
      finished = true;
      cancelAnimationFrame(raf);
      next.onended = next.onpause = next.onplaying = next.onwaiting = null;
      $('resume').hidden = true;
      busy(false);
      showSub(null);
      showNote(null);
      if (o.bar) o.bar(1);
      resolve(value);
    };
    const tick = () => {
      if (finished) return;      // finish() can run inside this very callback; never schedule another frame after it
      const t = next.currentTime, d = next.duration || 1;
      if (o.bar) o.bar(t / d);
      showSub(lines.find(l => t >= l.t0 && t <= l.t1));
      const note = notes.find(n => t >= n.t0 && t <= n.t1);
      showNote(note ? (typeof note.text === 'function' ? note.text(o.state || {}) : note.text) : null);
      if (o.flip && !flipped && t >= o.flip.t) { flipped = true; setClock(o.flip.clock, o.deal, true); }
      if (o.choice && !asked && (next.ended || (!o.late && d - t <= 1))) {
        asked = true;
        if (o.preset) { finish(o.preset); return; }
        ask(o.choice).then(finish);
      }
      raf = requestAnimationFrame(tick);
    };
    next.onended = () => { if (!o.choice) finish(); };
    // A pause we didn't ask for (a phone call, a hidden tab) must not strand the episode.
    next.onpause = () => { if (!finished && !next.ended) $('resume').hidden = false; };
    next.onplaying = () => { $('resume').hidden = true; busy(false); };
    next.onwaiting = () => { if (!finished && !next.ended) busy(true); };
    if (next.paused) $('resume').hidden = false;
    raf = requestAnimationFrame(tick);
  });
}

/* ----- the choice: three options, a few seconds to pick ----- */
function ask(choice) {
  return new Promise(resolve => {
    const sheet = $('choice'), box = $('opts');
    $('question').textContent = choice.question;
    box.innerHTML = '';
    sheet.classList.remove('done');
    let timer, settled = false;
    const pick = async (opt, btn) => {
      if (settled) return;
      settled = true;
      timer.cancel();
      document.removeEventListener('keydown', onKey);
      btn.classList.add('picked');
      sheet.classList.add('done');
      await wait(300);
      sheet.classList.remove('open');
      stage.classList.remove('choosing');
      resolve(opt);
    };
    const buttons = choice.opts.map((opt, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'opt';
      btn.innerHTML = '<i class="fill"></i><span></span><kbd></kbd>';
      btn.querySelector('span').textContent = opt.label;
      btn.querySelector('kbd').textContent = i + 1;
      btn.addEventListener('click', () => pick(opt, btn));
      box.append(btn);
      return btn;
    });
    const onKey = e => {
      const i = ['1', '2', '3'].indexOf(e.key);
      if (i >= 0) pick(choice.opts[i], buttons[i]);
    };
    document.addEventListener('keydown', onKey);
    // The first option's own background is the countdown: when it fills, it fires.
    timer = buttons[0].querySelector('.fill').animate(
      [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }],
      { duration: CHOICE_MS, easing: 'linear', fill: 'forwards' });
    timer.onfinish = () => pick(choice.opts[0], buttons[0]);
    stage.classList.add('choosing');
    sheet.classList.add('open');
  });
}

const PHONE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>';
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}
function youSay(text, label) {
  const p = el('p', 'you');
  p.append(el('small', '', label || '你'), text);

}
const asideLine = text => el('p', 'you aside', text);

async function scene(spec) {
  const box = $('scene');
  box.innerHTML = '';
  let hold = 1300;
  if (spec.type === 'call') {
    const call = el('div', 'call');
    call.innerHTML = '<div class="ring">' + PHONE + '</div><p class="who"></p><p class="state">正在呼叫</p>';
    call.querySelector('.who').textContent = spec.who;
    box.append(call);
    setTimeout(() => { call.querySelector('.state').textContent = '已接通'; }, 900);
    hold = 1700;
  } else if (spec.type === 'card') {
    const card = el('div', 'card');
    card.innerHTML = '<span class="brand">云顶集团</span><span class="chip"></span><span class="holder"></span><span class="tier">黑卡</span>';
    card.querySelector('.holder').textContent = honorific() + '事长';
    box.append(card);
    hold = 1700;
  } else if (spec.type === 'dots') {
    const dots = el('p', 'dots');
    spec.glyphs.forEach(g => dots.append(el('i', '', g)));
    box.append(dots);
    hold = 1700;
  } else if (spec.type === 'tape') {
    const tape = el('div', 'tape'), wave = el('div', 'wave');
    for (let i = 0; i < 17; i++) wave.append(el('i'));
    tape.append(wave, el('p', 'label', spec.label), el('p', 'quote', spec.quote));
    box.append(tape);
    hold = 3000;
  } else if (spec.type === 'report') {
    const doc = el('div', 'report');
    doc.append(el('h3', '', spec.title));
    spec.rows.forEach(([k, v]) => { const row = el('p'); row.append(el('small', '', k), v); doc.append(row); });
    doc.append(el('span', 'stamp', spec.stamp));
    box.append(doc);
    hold = 3400;
  } else if (spec.type === 'msg') {
    const msg = el('div', 'msg');
    msg.append(el('p', 'who', spec.who), el('p', 'text', spec.text));
    box.append(msg);
    hold = 2400;
  }
  if (spec.say) box.append(youSay(spec.say));
  if (spec.big) box.append(el('p', 'big', spec.big));
  if (spec.aside) box.append(asideLine(spec.aside));
  const words = (spec.say || '') + (spec.big || '') + (spec.aside || '');
  hold = Math.max(hold, 900 + 70 * words.length);   // longer lines get longer to be read
  box.classList.add('on');
  await wait(hold);
  box.classList.remove('on');
}
// Narration between scenes: the lines arrive one at a time.
async function card(lines) {
  const box = $('scene'), words = el('div', 'words');
  box.innerHTML = '';
  box.append(words);
  box.classList.add('on');
  for (const text of lines) {
    words.append(el('p', '', text));
    await wait(1000 + 75 * text.length);
  }
  await wait(300);
  box.classList.remove('on');
}
// Opens a later episode: its name, and what you did in the one before.
async function titleCard(ep) {
  const box = $('scene'), last = readStore().last[ep.n - 1];
  box.innerHTML = '';
  box.append(youSay(ep.name, '第 ' + ep.n + ' 集'));
  if (last) box.append(asideLine('上一集：' + last.join('，') + '。'));
  box.classList.add('on');
  await wait(last ? 2600 : 1800);
  box.classList.remove('on');
}
async function reportMissing(ep, missing) {
  const box = $('scene');
  box.innerHTML = '';
  box.append(asideLine('第 ' + ep.n + ' 集还有 ' + missing.length + ' 个镜头没生成好：' + missing.join('、') + '。'));
  box.classList.add('on');
  await wait(3200);
  box.classList.remove('on');
}

/* ----- an episode. `o.from` starts at that step of the spine; `o.preset` answers that step's
   choice without asking (used to try another option straight from the ending); `o.state` and
   `o.picks` carry what was chosen before that step. ----- */
async function run(index, o = {}) {
  const ep = EPISODES[index], from = o.from || 0;
  const state = Object.assign({}, o.state), picks = Object.assign({}, o.picks);
  $('finale').hidden = true;
  $('cover').hidden = true;
  const missing = await findMissing(ep);
  if (missing.length) { await reportMissing(ep, missing); $('cover').hidden = false; return; }
  $('ep-no').textContent = '第 ' + ep.n + ' 集';
  buildBars(ep.acts.length);
  setClock(null);
  if (index > 0 && !from) { prime(clipAfter(ep, -1)); await titleCard(ep); }

  let act = -1, unit = 0;
  const bar = ratio => setBar(act, (unit + ratio) / ep.acts[act].units);
  // starting mid-episode, the story clock shows what the skipped steps had left it at
  const before = ep.flow.slice(0, from).filter(st => st.clock).pop();
  if (before) setClock(before.flip ? before.flip.clock : before.clock, ep.deal);
  for (let i = 0; i < ep.flow.length; i++) {
    const step = ep.flow[i];
    if (step.act) { setBar(act, 1); act++; unit = 0; continue; }
    if (i < from) { if (step.clip) unit += step.branch ? 2 : 1; continue; }
    const upNext = clipAfter(ep, i);
    if (step.card) { prime(upNext); await card(step.card); continue; }
    if (step.beat) {
      const spec = step.beat(state);
      if (spec) { prime(upNext); await scene(spec); }
      continue;
    }
    const choice = step.choice && ep.choices[step.choice];
    const preset = i === from ? o.preset : null;
    const pick = await playClip(step.clip, {
      bar, state, choice, preset, clock: step.clock, flip: step.flip, late: step.late, deal: ep.deal,
      tail: preset ? 4 : 0, upNext: step.branch ? null : upNext,
    });
    unit++;
    if (!choice) continue;
    state[step.choice] = pick.key;
    picks[step.choice] = pick;
    prime(pick.clip || upNext);        // the beat below gives it time to get ready
    await scene(typeof pick.scene === 'function' ? pick.scene(state) : pick.scene);
    if (pick.clip) { await playClip(pick.clip, { bar, state, upNext }); unit++; }
  }
  setBar(act, 1);
  ending(index, picks);
}

function ending(index, picks) {
  const ep = EPISODES[index], next = EPISODES[index + 1], store = readStore();
  const tried = new Set(store.tried[ep.n] || []);
  ep.asked.forEach(a => { if (picks[a.id]) tried.add(a.id + ':' + picks[a.id].key); });
  const headline = ep.asked.filter(a => a.choice.headline && picks[a.id]).map(a => picks[a.id].title);
  store.tried[ep.n] = [...tried];
  store.last[ep.n] = headline;
  writeStore(store);

  $('fin-to').textContent = honorific() + '，第 ' + ep.n + ' 集你的打法：';
  // parts that never break inside themselves, so a narrow screen wraps between them
  $('fin-title').innerHTML = '';
  headline.forEach((title, i) => $('fin-title').append(el('span', '', title + (i < headline.length - 1 ? '，' : ''))));
  const total = ep.asked.reduce((n, a) => n + a.choice.opts.length, 0);
  $('fin-count').textContent = '这一集有 ' + total + ' 个选项，你试过 ' + tried.size + ' 个。点任意一个，从那一刻重来。';
  const rows = $('fin-rows');
  rows.innerHTML = '';
  ep.asked.forEach(a => {
    const row = el('div', 'row', a.choice.question), pills = el('div', 'pills');
    a.choice.opts.forEach(opt => {
      const pill = el('button', 'pill' + (picks[a.id] === opt ? ' now' : tried.has(a.id + ':' + opt.key) ? ' tried' : ''), opt.label);
      pill.type = 'button';
      pill.addEventListener('click', () => {
        // keep what was chosen before this moment; everything after it is asked again
        const before = {}, state = {};
        ep.asked.filter(b => b.at < a.at && picks[b.id]).forEach(b => { before[b.id] = picks[b.id]; state[b.id] = picks[b.id].key; });
        run(index, { from: a.at, preset: opt, picks: before, state });
      });
      pills.append(pill);
    });
    row.append(pills);
    rows.append(row);
  });

  const actions = $('fin-actions');
  actions.innerHTML = '';
  const add = (label, cls, go) => {
    const b = el('button', cls, label);
    b.type = 'button';
    b.addEventListener('click', go);
    actions.append(b);
    return b;
  };
  const first = next ? add('看第 ' + next.n + ' 集', 'again', () => run(index + 1)) : add('从头再看一遍', 'again', () => run(index));
  if (next) add('从头再看一遍', 'ghost', () => run(index)); else add('回到第 1 集', 'ghost', () => run(0));
  $('fin-teaser').textContent = ep.teaser || '';
  $('finale').scrollTop = 0;
  $('finale').hidden = false;
  first.focus();
}

$('start').addEventListener('click', () => run(0));
$('skip').addEventListener('click', () => run(1));
const resume = () => { const v = videos[current]; if (v && v.paused && !v.ended) v.play().catch(() => {}); };
$('resume').addEventListener('click', resume);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') resume(); });
$('surname').addEventListener('keydown', e => { if (e.key === 'Enter' && !$('start').disabled) $('start').click(); });
$('mute').addEventListener('click', () => {
  const muted = $('mute').getAttribute('aria-pressed') !== 'true';
  $('mute').setAttribute('aria-pressed', String(muted));
  $('mute').setAttribute('aria-label', muted ? '打开声音' : '静音');
  videos.forEach(v => { v.muted = muted; });
});

// The cover's own button says whether the first episode's clips are all there.
findMissing(EPISODES[0]).then(missing => {
  if (missing.length) {
    $('start').textContent = '还差 ' + missing.length + ' 个镜头';
    $('problem').hidden = false;
    $('problem').textContent = '这些镜头还没生成好：' + missing.join('、') + '。生成完成后刷新页面。';
    return;
  }
  $('start').disabled = false;
  $('start').textContent = '开始第 1 集';
  prime(clipAfter(EPISODES[0], -1));
});
